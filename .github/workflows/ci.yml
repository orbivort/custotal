# CI pipeline for the custotal monorepo.
#
# Staged so fast feedback comes first and expensive infrastructure later:
#   quality     — typecheck + eslint + stylelint + prettier for the whole workspace (no services)
#   unit        — backend unit suite + frontend suite (no services, parallel)
#   integration — backend supertest suites against a real PostgreSQL service
#   e2e         — boots the real server process against its own PostgreSQL service
#   e2e-ui      — Playwright browser journeys against the MSW-backed dev server (no services)
#   build       — verifies the frontend production build and uploads the dist artifact
#   docker      — builds both container images and smoke-tests them
#
# Coverage is collected on the integration job because it exercises the most
# source surface. That job also uploads the resulting lcov report to Codecov
# (flag `backend`) using the CODECOV_TOKEN repository secret; the upload is
# non-blocking, so a Codecov outage never fails an otherwise-green build.
#
# Security posture:
#   - Least-privilege GITHUB_TOKEN (contents: read) for every job.
#   - Per-job timeouts so a hung run cannot burn runner minutes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatchable so release-prepare.yml can run the pipeline against a release
  # branch. A pull request opened with GITHUB_TOKEN emits no `pull_request`
  # event, so the release pull request would otherwise carry no checks at all —
  # including the checks branch protection requires.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (typecheck + lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # reads packageManager from package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The generated Prisma Client is gitignored, so it must be produced before
      # anything that imports it (typecheck resolves the backend's client imports).
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Lint CSS (stylelint)
        run: pnpm lint:css
      - name: Check formatting (prettier)
        run: pnpm format:check

  unit:
    name: Unit tests (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The backend unit project imports the generated client (the Prisma
      # error-class mocks), so generate it explicitly instead of relying on the
      # package's pre-command hooks.
      - run: pnpm db:generate
      # No database required: the unit project has no global setup.
      - run: pnpm --filter @custotal/backend test:unit
      - run: pnpm test:frontend

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    services:
      postgres:
        # uuidv7() defaults require PostgreSQL 18+ (see prisma/schema.prisma).
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: custotal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/custotal_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Migrations are applied by test/support/global-setup.ts; the database
      # only needs to exist (created via POSTGRES_DB above).
      - run: pnpm --filter @custotal/backend test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          # The backend `test:coverage` script runs Vitest from the workspace
          # root (`pnpm --workspace-root exec`), so the v8 report is written to
          # the root `coverage/` directory, not into the package.
          path: coverage/
          # Fail when the report is missing rather than skipping the upload
          # silently — a silent skip is how this path drifted unnoticed.
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage to Codecov
        # Codecov is reporting, not a gate: `fail_ci_if_error: false` keeps an
        # upload rejection or a Codecov outage from failing a green build. The
        # step still runs when the test step failed (!cancelled()) so the
        # partial report is not lost, and it is a no-op on fork pull requests,
        # where repository secrets (CODECOV_TOKEN) are not exposed.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Emitted by the `lcov` reporter in the Vitest coverage blocks. The
          # backend `test:coverage` script runs Vitest from the workspace root,
          # so the report lands in the root `coverage/` directory.
          files: coverage/lcov.info
          flags: backend
          name: backend
          fail_ci_if_error: false

  e2e:
    name: E2E smoke (real server)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integration
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: custotal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/custotal_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      # Boots src/index.ts on a free port, waits for /health, tears down after.
      - run: pnpm --filter @custotal/backend test:e2e

  e2e-ui:
    name: E2E (browser journeys)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # The suite runs against Mock Service Worker, so no database is needed.
      # Playwright's managed web server boots the Vite dev server with mocks on.
      - name: Install Playwright browsers
        run: pnpm --filter @custotal/frontend exec playwright install --with-deps chromium firefox webkit
      - name: Run Playwright tests
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
          retention-days: 7

  build:
    name: Build (frontend production bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: packages/frontend/dist/
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker images (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/backend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: custotal-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke test backend image
        # No database is available here, so this asserts the important build
        # invariant: the Prisma Client generated during the build resolves from
        # the image's runtime layout. It is generated into the package source
        # tree rather than node_modules, so it is imported by path — the
        # @prisma/client package is only a runtime shim and no longer exposes a
        # generated client.
        run: |
          docker run --rm --entrypoint node custotal-backend:ci \
            --input-type=module -e "const { PrismaClient } = await import('/app/packages/backend/src/generated/prisma/client.ts'); if (typeof PrismaClient !== 'function') { process.exit(1); } console.log('prisma client ok');"

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/frontend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: custotal-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test frontend image
        # The API hostname is only resolvable in the Compose stack, so point it
        # at loopback for the probe; /healthz never touches the upstream.
        run: |
          trap 'docker rm -f custotal-web-smoke' EXIT
          docker run -d --name custotal-web-smoke --add-host backend:127.0.0.1 -p 8080:8080 custotal-frontend:ci
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then
              echo "frontend is serving the SPA shell"
              exit 0
            fi
            sleep 2
          done
          echo "frontend did not become healthy"
          docker logs custotal-web-smoke
          exit 1
