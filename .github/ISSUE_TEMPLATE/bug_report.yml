name: Bug report
description: Report a reproducible defect in Custotal.
title: '[Bug]: '
labels: ['bug', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please search existing issues first, and
        do not report security vulnerabilities here — see SECURITY.md.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am running a supported version (see SECURITY.md).
          required: true
        - label: This is not a security vulnerability (those are reported privately).
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Custotal version
      description: Shown in the browser tab title, or in `packages/frontend/package.json`.
      placeholder: '1.0.0'
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Backend API
        - Frontend UI
        - Authentication / sessions / RBAC
        - CSV import / export
        - Reports
        - Search
        - Deployment / operations
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node, pnpm, PostgreSQL, browser, and deployment method.
      placeholder: |
        - OS: Windows 11
        - Node: 24.19.0
        - pnpm: 11.21.0
        - PostgreSQL: 18.0
        - Browser: Chrome 128
        - Deployment: local dev
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and personal data before posting.
      render: shell
    validations:
      required: false
