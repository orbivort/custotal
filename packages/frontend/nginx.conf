# Custotal frontend — nginx serving the built SPA and proxying the API.
#
# This container runs as the unprivileged `nginx` user (see the Dockerfile), so
# every writable path lives under /tmp and the server listens on 8080 (a port
# above 1024). Replacing the stock nginx.conf also drops the default server that
# would otherwise answer on port 80.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Do not advertise the nginx version.
  server_tokens off;

  # Writable paths for the non-root worker.
  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # The CSV import endpoints accept up to 12 MB (see backend src/app.ts).
  client_max_body_size 12m;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    application/javascript
    application/json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain;

  # Upstream is the Compose service name (`backend`). Keeping the SPA and the
  # API on one origin is what lets the HttpOnly ct_session cookie flow without
  # CORS or SameSite edge cases.
  upstream custotal_backend {
    server backend:4000;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Container health probe. The API's /health is a real database check, so it
    # is deliberately a separate path.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api {
      proxy_pass http://custotal_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location = /health {
      proxy_pass http://custotal_backend/health;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames under /assets, so they are immutable.
    location /assets/ {
      expires 1y;
    }

    # Never cache the shell document: it references the current asset hashes.
    location = /index.html {
      expires -1;
    }

    # Client-side routing: unknown paths fall back to the SPA shell.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
